# =============================================================================
# Handla — Docker Compose OVERRIDE (production overlay, auto-loaded)
# =============================================================================
# Docker Compose AUTOMATICALLY merges this file on top of docker-compose.yml
# whenever you run `docker compose ...` with NO explicit `-f` flags. That means
# a plain, zero-argument:
#
#     docker compose up -d --build
#
# run from the repo root brings up the COMPLETE production stack:
#     mysql · redis · api · web (Next.js) · nginx (+TLS) · certbot
#
# This is what an automated SSH deploy tool runs by default, so the whole site
# comes up correctly without needing to know about extra -f files.
#
# ── Local development ────────────────────────────────────────────────────────
# For local dev you do NOT want nginx/web/certbot. Opt out of this override with
# an explicit file list, e.g.:
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# (Compose only auto-loads the override when you pass NO -f flags at all.)
#
# All build-context paths are relative to the repo root (./handla-frontend,
# ./deploy/nginx).
# =============================================================================

volumes:
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

services:

  # NOTE: the API port is already bound to 127.0.0.1 in docker-compose.yml, so
  # it is not publicly reachable. nginx proxies to it in-network at api:3001.

  # ── Frontend (Next.js standalone) ───────────────────────────────────────────
  web:
    build:
      context: ./handla-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL:    "https://api.handla.tech/api"
        NEXT_PUBLIC_SOCKET_URL: "https://api.handla.tech"
        NEXT_PUBLIC_APP_URL:    "https://handla.tech"
    container_name: handla_web
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - handla_net
    depends_on:
      - api

  # ── Nginx: public TLS entrypoint + reverse proxy ────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: handla_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - handla_net
    depends_on:
      - api
      - web

  # ── Certbot: obtains + renews Let's Encrypt certs (webroot challenge) ───────
  certbot:
    image: certbot/certbot:latest
    container_name: handla_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renew twice a day; nginx reload is handled by the host cron / redeploy.
    entrypoint: >
      sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'
