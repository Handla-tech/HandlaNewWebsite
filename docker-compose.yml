# =============================================================================
# Handla — base Docker Compose
# Services: mysql · redis · api
#
# ── Production (VPS) ─────────────────────────────────────────────────────────
# docker-compose.override.yml is AUTO-LOADED on top of this file when you run
# Compose with NO -f flags, adding web + nginx + certbot. So the full site
# comes up with a plain:
#   ./deploy.sh                 # (recommended) or:
#   docker compose up -d --build
# Requires the root ./.env (deploy.sh generates it) + handla-backend/.env.
#
# ── Local development (hot-reload, NO nginx/web/certbot) ─────────────────────
# Pass explicit -f flags so the prod override is NOT auto-loaded:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  handla_net:
    driver: bridge

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── MySQL ────────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: handla_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DATABASE_NAME:-handla_db}
      # Runtime identity (DML-only). MUST be provided explicitly — no silent
      # fallback to the deprecated privileged legacy `handla` user. See
      # deploy/mysql/runtime-migrator-split.sql. Canonical value: handla_runtime.
      MYSQL_USER:          ${DATABASE_USER:?DATABASE_USER is required - canonical handla_runtime, legacy handla is deprecated}
      MYSQL_PASSWORD:      ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD is required}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - handla_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DATABASE_USER:?DATABASE_USER is required - canonical handla_runtime}", "-p${DATABASE_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis ────────────────────────────────────────────────────────────────────
  # Hardened: ACL authentication via a dedicated application user; the built-in
  # unauthenticated "default" user is disabled. The custom entrypoint generates
  # the ACL file from REDIS_PASSWORD (injected from .env, never committed) on
  # every boot, so the config survives container recreation and password
  # rotation. Redis is only on the private handla_net bridge and publishes no
  # host port, so it is never reachable from the internet.
  redis:
    image: redis:7-alpine
    container_name: handla_redis
    restart: unless-stopped
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-handla_app}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    entrypoint: ["/usr/local/bin/redis-entrypoint.sh"]
    volumes:
      - redis_data:/data
      - ./deploy/redis/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    networks:
      - handla_net
    healthcheck:
      # Authenticate as the application user (default user is disabled). Use an
      # env-var password so it is not visible in `ps`/process args.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user \"$$REDIS_USERNAME\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Handla API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./handla-backend
      dockerfile: Dockerfile
      target: runtime
    container_name: handla_api
    restart: unless-stopped
    env_file:
      - ./handla-backend/.env
    environment:
      NODE_ENV:          production
      PORT:              ${PORT:-3001}
      # Database — points to the mysql service above
      DATABASE_HOST:     mysql
      DATABASE_PORT:     3306
      DATABASE_NAME:     ${DATABASE_NAME:-handla_db}
      # Runtime identity (DML-only): required, no legacy fallback.
      DATABASE_USER:     ${DATABASE_USER:?DATABASE_USER is required - canonical handla_runtime, legacy handla is deprecated}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      # Migrator identity (schema-scoped DDL, migrations only). Optional here:
      # when unset the migration DataSource falls back to DATABASE_USER (see
      # handla-backend/src/config/data-source.ts). Sourced from env_file too;
      # listed explicitly so Compose interpolation stays in lockstep.
      DATABASE_MIGRATION_USER:     ${DATABASE_MIGRATION_USER:-}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:-}
      # Redis — points to the redis service above (ACL-authenticated)
      REDIS_HOST:        redis
      REDIS_PORT:        6379
      REDIS_USERNAME:    ${REDIS_USERNAME:-handla_app}
      REDIS_PASSWORD:    ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Schema sync — reads from .env; safe to enable for local dev, never in real prod
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-false}
    # Bind to loopback so the API is never exposed directly to the public
    # internet. In production nginx proxies to it in-network (api:3001); in
    # local dev you still reach it at http://localhost:3001.
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    networks:
      - handla_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (not localhost): force IPv4 so Alpine's IPv6 ::1 resolution
      # doesn't cause a false "unhealthy" against a server bound to 0.0.0.0.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-3001}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
