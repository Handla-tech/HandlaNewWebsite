name: CI + Deploy

# Automated CI:
#   - push to main, dev -> runs backend tests & frontend build check
#   - pull_request to main, dev -> runs backend tests & frontend build check
#
# Manual Deploy:
#   - workflow_dispatch -> only manual dispatch on refs/heads/main with confirm_deploy='deploy'
#                          runs tests, then invokes the root-owned wrapper on the Hostinger VPS.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type 'deploy' to confirm production deployment"
        required: true
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Backend tests
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handla-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.build.json
      - name: Unit tests
        run: npm test -- --ci

  # 2. Frontend build check
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handla-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - name: Build (public env baked at build time)
        env:
          NEXT_PUBLIC_API_URL: https://api.handla.tech/api
          NEXT_PUBLIC_SOCKET_URL: https://api.handla.tech
          NEXT_PUBLIC_APP_URL: https://handla.tech
        run: npm run build

  # 3. Deployment security policy validation
  #    Runs the Traefik Full Access validator regression tests, Docker Compose
  #    config syntax checks, deploy wrapper syntax check, and Dockerfile
  #    healthcheck verification.
  #    Does NOT deploy, SSH, contact production, or run docker compose up.
  validate-deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_USER: handla_runtime
      DATABASE_PASSWORD: ci_test_only_not_real
      DATABASE_ROOT_PASSWORD: ci_test_only_not_real
      REDIS_PASSWORD: ci_test_only_not_real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup synthetic CI env files for Compose validation
        run: |
          # Create synthetic non-sensitive handla-backend/.env required by Compose env_file
          # if not already present. This ensures CI runs on ephemeral runners without real secrets.
          if [ ! -f handla-backend/.env ]; then
            echo "# Synthetic non-sensitive env for CI compose validation" > handla-backend/.env
            echo "PORT=3001" >> handla-backend/.env
            echo "DATABASE_NAME=handla_db" >> handla-backend/.env
            chmod 600 handla-backend/.env
            echo "Created synthetic handla-backend/.env for CI validation"
          fi

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose \
            --env-file /dev/null \
            -f docker-compose.yml \
            config --format json > /dev/null

      - name: Validate merged Traefik Full Access Compose config
        run: |
          docker compose \
            --env-file /dev/null \
            -f docker-compose.yml \
            -f deploy/docker-compose.traefik.yml \
            -f deploy/docker-compose.full-access.yml \
            config --format json > /dev/null

      - name: Run Traefik Full Access validator regression tests
        run: node deploy/validate-traefik-access.test.cjs

      - name: Check deploy wrapper bash syntax
        run: bash -n deploy/privilege/handla-production-deploy

      - name: Run deployment lock regression tests
        run: bash deploy/privilege/test-deployment-lock.sh

      - name: Check validator and test JS syntax
        run: |
          node -c deploy/validate-traefik-access.cjs
          node -c deploy/validate-traefik-access.test.cjs

      - name: Verify Dockerfile healthcheck uses node (not wget)
        run: |
          if grep -q 'CMD wget' handla-backend/Dockerfile; then
            echo "FAIL: Dockerfile uses wget-based healthcheck (should use node)" >&2
            exit 1
          fi
          if ! grep -q 'CMD node' handla-backend/Dockerfile; then
            echo "FAIL: Dockerfile HEALTHCHECK does not use node" >&2
            exit 1
          fi
          echo "PASS: Dockerfile healthcheck uses node"

      - name: Verify docker-compose.yml healthcheck uses node (not wget)
        run: |
          if grep -q 'wget.*api/health' docker-compose.yml; then
            echo "FAIL: docker-compose.yml uses wget-based API healthcheck (should use node)" >&2
            exit 1
          fi
          if ! grep -q 'node:http.*api/health' docker-compose.yml; then
            echo "FAIL: docker-compose.yml API healthcheck does not use node http" >&2
            exit 1
          fi
          echo "PASS: docker-compose.yml healthcheck uses node"

  # 4. Deploy to VPS (MANUAL ONLY: requires workflow_dispatch on main with confirm_deploy == 'deploy')
  deploy:
    environment: production
    needs: [test-backend, build-frontend, validate-deploy]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_deploy == 'deploy'
    runs-on: ubuntu-latest
    steps:
      # Deploy as the dedicated least-privilege account `handla-deploy`, NOT root.
      # (security/deploy-user-hardening) The remote user is pinned here in-code so
      # the non-root deploy identity is visible in review and enforced regardless
      # of secret drift; `secrets.VPS_USER` may still override it if intentionally
      # set, but it must never be `root` — the preflight below aborts if it is.
      #
      # (security/docker-deploy-privilege-hardening) `handla-deploy` is NO LONGER a
      # member of the `docker` group (docker-group membership is root-equivalent on
      # the host). Deployment now runs through a single fixed, ROOT-OWNED wrapper
      # invoked via a narrow sudo rule:
      #     sudo /usr/local/sbin/handla-production-deploy
      # The wrapper takes NO arguments, hard-codes repo/branch/dir, and deploys only
      # origin/main from a SEPARATE root-owned trusted checkout (/opt/handla-production)
      # that handla-deploy cannot modify. CI therefore never touches docker.sock and
      # never runs user-writable deploy code as root.
      - name: Deploy over SSH (root-owned wrapper, non-root deploy user)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'handla-deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            # Preflight: refuse to deploy as root. GitHub Actions must authenticate
            # as the dedicated least-privilege `handla-deploy` account.
            WHOAMI="$(whoami)"
            echo "[deploy] Connected to VPS as: ${WHOAMI}"
            if [ "${WHOAMI}" = "root" ] || [ "$(id -u)" = "0" ]; then
              echo "[deploy] FATAL: connected as root. CI must deploy as the non-root 'handla-deploy' user." >&2
              echo "[deploy]        Update the VPS_USER / VPS_SSH_KEY secrets to the handla-deploy account." >&2
              exit 1
            fi
            # Trigger the fixed, root-owned production-deploy wrapper. This is the
            # ONLY command handla-deploy is permitted to run as root (NOPASSWD),
            # it accepts no arguments, and it fetches/deploys origin/main itself
            # from the root-owned trusted checkout.
            sudo /usr/local/sbin/handla-production-deploy
