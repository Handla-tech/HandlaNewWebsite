# =============================================================================
# Drop-in override for handla-backup.service
# INSTALL: /etc/systemd/system/handla-backup.service.d/onfailure-alert.conf
# =============================================================================
# Wires the backup unit into the monitoring alert path WITHOUT modifying the
# base unit (which is owned by the security/offsite-backup-dr branch). On any
# non-zero backup exit, systemd starts handla-monitor-alert@handla-backup.service
# which dispatches a CRITICAL alert (local always; external if a channel is set).
#
# Apply with:
#   install -d -o root -g root -m 0755 /etc/systemd/system/handla-backup.service.d
#   install -o root -g root -m 0644 onfailure-alert.conf \
#       /etc/systemd/system/handla-backup.service.d/onfailure-alert.conf
#   systemctl daemon-reload
#
# Requires handla-monitor-alert@.service to be installed (this phase).
[Unit]
OnFailure=handla-monitor-alert@%n.service
