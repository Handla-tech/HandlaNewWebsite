# =============================================================================
# Handla — Nginx reverse proxy (production)
#   handla.tech       -> web  (Next.js :3000)
#   www.handla.tech   -> redirect to handla.tech
#   api.handla.tech   -> api  (NestJS :3001, incl. websockets)
#
# TLS certs are issued by certbot into /etc/letsencrypt (mounted volume).
# BEFORE the first cert exists, use handla.bootstrap.conf instead (HTTP only),
# issue the certs, then swap to this file and reload nginx. See DEPLOYMENT.md.
# =============================================================================

# ── ACME challenge + HTTP->HTTPS redirect (all hosts) ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name handla.tech www.handla.tech api.handla.tech;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend: handla.tech ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name handla.tech;

    ssl_certificate     /etc/letsencrypt/live/handla.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/handla.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── www redirect -> apex ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.handla.tech;

    ssl_certificate     /etc/letsencrypt/live/handla.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/handla.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://handla.tech$request_uri;
}

# ── API: api.handla.tech (REST + Socket.io websockets) ───────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.handla.tech;

    ssl_certificate     /etc/letsencrypt/live/api.handla.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.handla.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Uploads go direct to S3 (presigned), so the API body stays small.
    client_max_body_size 5m;

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;

        # WebSocket upgrade (Socket.io chat gateway)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived websocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
