# =============================================================================
# Handla — Nginx BOOTSTRAP config (HTTP only, no TLS)
#
# Use this ONLY for the very first certificate issuance, when
# /etc/letsencrypt/live/... does not exist yet (the real handla.conf references
# cert files and nginx will refuse to start without them).
#
# Procedure (see DEPLOYMENT.md):
#   1. Put THIS file in nginx/conf.d/ (instead of handla.conf)
#   2. docker compose ... up -d nginx
#   3. Run certbot to issue certs for handla.tech, www.handla.tech, api.handla.tech
#   4. Swap handla.conf back into conf.d/, remove this file, reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name handla.tech www.handla.tech api.handla.tech;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Simple placeholder so the domains resolve to something during setup.
    location / {
        return 200 'Handla is being set up. TLS issuance in progress.\n';
        add_header Content-Type text/plain;
    }
}
